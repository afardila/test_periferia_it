<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de contratos</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#6b7280; --line:#e5e7eb; --brand:#1d4ed8; --warn:#b45309; --warnbg:#fffbeb; --ok:#15803d; --bad:#b91c1c; }
  * { box-sizing:border-box } body { margin:0; font:15px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; height:100dvh }
  header { padding:10px 14px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  header h1 { font-size:16px; margin:0; flex:1 }
  button { font:inherit; border:1px solid var(--line); background:var(--card); padding:6px 10px; border-radius:8px; cursor:pointer }
  button.primary { background:var(--brand); color:#fff; border-color:var(--brand) }
  button.danger { color:var(--bad); border-color:var(--bad) }
  #log { flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:10px }
  .msg { max-width:86%; padding:9px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word }
  .msg.bot { white-space:normal } .msg table { border-collapse:collapse; margin:6px 0; font-size:13px } .msg th,.msg td { border:1px solid var(--line); padding:3px 7px; text-align:left; vertical-align:top } .msg th { background:#f3f4f6 } .msg code { background:#f3f4f6; padding:0 3px; border-radius:4px; font-size:13px } .msg .h { font-weight:700; margin-top:6px } .msg .sp { height:6px }
  .user { align-self:flex-end; background:var(--brand); color:#fff }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--line) }
  .err { align-self:flex-start; background:#fef2f2; border:1px solid #fecaca; color:var(--bad) }
  details.tool { align-self:flex-start; max-width:92%; background:#eef2ff; border:1px solid #c7d2fe; border-radius:10px; padding:6px 10px; font-size:13px }
  details.tool summary { cursor:pointer; font-weight:600 }
  details.tool.fail { background:#fef2f2; border-color:#fecaca }
  details.tool pre { margin:6px 0 0; white-space:pre-wrap; word-break:break-word; font-size:12px }
  .confirm { align-self:flex-start; max-width:92%; background:var(--warnbg); border:2px solid #f59e0b; border-radius:12px; padding:10px 12px }
  .confirm b { color:var(--warn) } .confirm pre { white-space:pre-wrap; word-break:break-word; font-size:12px; margin:6px 0 }
  .confirm .row { display:flex; gap:8px }
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 6px }
  form { display:flex; gap:8px; padding:10px 14px; background:var(--card); border-top:1px solid var(--line) }
  input { flex:1; font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:10px }
  #usage { font-size:12px; color:var(--mute); padding:0 14px 8px; background:var(--card) }
</style>
</head>
<body>
<header>
  <h1>Agente de contratos</h1>
  <button id="state">Ver maestro</button>
  <button id="new">Nueva sesión</button>
</header>
<div id="log"></div>
<div class="chips" id="chips"></div>
<form id="f"><input id="q" placeholder="Escribe una instrucción…" autocomplete="off"><button class="primary">Enviar</button></form>
<div id="usage"></div>
<script>
const sid = () => (localStorage.sid ||= crypto.randomUUID());
const log = document.getElementById('log'), q = document.getElementById('q');
let busy = false;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function add(node) { log.appendChild(node); log.scrollTop = log.scrollHeight; return node; }
const pretty = (o) => typeof o === 'string' ? o : JSON.stringify(o, null, 2);

function toolBox(name, input) {
  const d = el('details', 'tool'); d.dataset.name = name;
  d.appendChild(el('summary', null, '🔧 ' + name));
  d.appendChild(el('pre', null, 'entrada: ' + pretty(input)));
  return d;
}


/** Markdown mínimo y SEGURO: primero se escapa todo el HTML; solo se generan etiquetas propias (tablas, negrita, código, listas). */
function md(texto) {
  const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const inl = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const lineas = texto.split('\n'); const out = [];
  for (let i = 0; i < lineas.length; i++) {
    const l = lineas[i];
    if (/^\s*\|.*\|\s*$/.test(l)) {
      const filas = []; while (i < lineas.length && /^\s*\|.*\|\s*$/.test(lineas[i])) filas.push(lineas[i++]); i--;
      const celdas = (f) => f.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const cuerpo = filas.filter((f) => !/^\s*\|[\s:|-]+\|\s*$/.test(f));
      out.push('<table>' + cuerpo.map((f, k) => '<tr>' + celdas(f).map((c) => (k === 0 ? '<th>' : '<td>') + inl(c) + (k === 0 ? '</th>' : '</td>')).join('') + '</tr>').join('') + '</table>');
    } else if (/^#{1,4}\s/.test(l)) out.push('<div class="h">' + inl(l.replace(/^#+\s/, '')) + '</div>');
    else if (/^\s*[-*]\s/.test(l)) out.push('<div class="li" style="padding-left:' + (l.match(/^\s*/)[0].length * 6 + 10) + 'px">• ' + inl(l.replace(/^\s*[-*]\s/, '')) + '</div>');
    else out.push(l.trim() ? '<div>' + inl(l) + '</div>' : '<div class="sp"></div>');
  }
  return out.join('');
}
function botMsg(texto) { const d = el('div', 'msg bot'); d.innerHTML = md(texto); return d; }

function toolBox(ev) {
  const d = el('details', 'tool' + (ev.ok ? '' : ' fail'));
  d.appendChild(el('summary', null, (ev.ok ? '✅ ' : '⚠️ ') + ev.name + (ev.input && ev.input.mensaje_id ? ' · ' + ev.input.mensaje_id : '')));
  d.appendChild(el('pre', null, 'argumentos: ' + pretty(ev.input)));
  d.appendChild(el('pre', null, (ev.ok ? 'resultado: ' : 'error: ') + pretty(ev.output)));
  return d;
}
function render(j) {
  for (const ev of (j.events || [])) {
    if (ev.type === 'text') add(botMsg(ev.text));
    else if (ev.type === 'user') add(el('div', 'msg user', ev.text));
    else if (ev.type === 'error') add(el('div', 'msg err', ev.message));
    else if (ev.type === 'tool') add(toolBox(ev));
  }
  if (j.needsConfirmation) {
    const c = el('div', 'confirm');
    const t = el('div'); t.appendChild(el('b', null, '⏸ El agente espera tu confirmación. ')); t.appendChild(document.createTextNode('Responde en el chat confirmando o corrigiendo los campos en revisión; solo entonces registrará.'));
    c.appendChild(t); add(c); q.focus();
  }
}

async function call(url, body) {
  if (busy) return; busy = true;
  const wait = add(el('div', 'msg bot', 'Pensando…'));
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: sid(), ...body }) });
    const j = await r.json(); wait.remove(); render(j);
    if (j.usage) document.getElementById('usage').textContent = `Llamadas al modelo: ${j.usage.calls} · tokens entrada: ${j.usage.input} · salida: ${j.usage.output} · caché leída: ${j.usage.cache_read} · caché escrita: ${j.usage.cache_write}`;
  } catch (e) { wait.remove(); add(el('div', 'msg err', 'Error de red: ' + e.message)); }
  busy = false;
}

document.getElementById('f').onsubmit = (e) => { e.preventDefault(); const m = q.value.trim(); if (!m) return; q.value = ''; add(el('div', 'msg user', m)); call('/api/chat', { message: m }); };
document.getElementById('new').onclick = async () => { await fetch('/api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: sid() }) }); localStorage.removeItem('sid'); log.textContent = ''; document.getElementById('usage').textContent = ''; };
document.getElementById('state').onclick = async () => { const s = await (await fetch('/api/state?sessionId=' + sid())).json(); const d = add(el('details', 'tool')); d.append(el('summary', null, '📋 Maestro (' + s.maestro.length + ' contratos) · ' + Object.keys(s.procesados || {}).length + ' mensajes procesados'), el('pre', null, pretty(s))); };
for (const p of ['Procesa el buzón de contratos con fecha de hoy 2026-09-03. Registra lo que esté limpio, muéstrame lo que requiere revisión campo por campo y termina con el reporte de alertas. No registres nada dudoso sin preguntarme.', 'Procesa únicamente el mensaje msg-006', 'Confirmo el valor 0 y la fecha fin 2027-08-31'])
  { const b = el('button', null, p.length > 45 ? p.slice(0, 42) + '…' : p); b.title = p; b.onclick = () => { add(el('div', 'msg user', p)); call('/api/chat', { message: p }); }; document.getElementById('chips').appendChild(b); }
// Al recargar la página se recupera el historial de la sesión (GET /api/sessions/:id)
(async () => { try { const r = await fetch('/api/sessions/' + sid()); if (!r.ok) return; const h = await r.json(); render({ events: h.eventos || [] }); if (h.usage) document.getElementById('usage').textContent = `Llamadas al modelo: ${h.usage.calls} · tokens entrada: ${h.usage.input} · salida: ${h.usage.output} · caché leída: ${h.usage.cache_read} · caché escrita: ${h.usage.cache_write}`; } catch {} })();
</script>
</body>
</html>
